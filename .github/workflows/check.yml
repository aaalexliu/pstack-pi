name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
      - run: npm run check
      - name: Check clean archive
        run: |
          archive="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive"
          test ! -e "$archive/.git"
          cd "$archive"
          npm ci --ignore-scripts
          npm run check
